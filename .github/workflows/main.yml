name: Build SuoziMusic iOS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build iOS App
        run: |
          xcodebuild -project SuoziMusic/SuoziMusic.xcodeproj \
            -scheme SuoziMusic \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R build/Release-iphoneos/SuoziMusic.app Payload/
          zip -r SuoziMusic.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: SuoziMusic-iOS
          path: SuoziMusic.ipa
